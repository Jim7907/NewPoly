server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Don't let other sites frame the trading UI (clickjacking).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /signer/lighter-signer.wasm {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Telegram alerts service (docker compose service "alerts"). Resolved lazily so
    # nginx still starts if that container is down.
    location /alerts-api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $alerts_upstream http://alerts:8080;
        proxy_pass $alerts_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        client_max_body_size 8k;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
