services:
  barometer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barometer
    restart: unless-stopped
    ports:
      - "${PORT:-3004}:3004"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DB_PATH=/app/data
    volumes:
      - barometer_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  barometer_data:
    driver: local
